; ESP8266 pack-voltage nag beeper — bare-module board, external 100k/20k divider into A0.
; Using a dev board with its own onboard A0 divider (e.g. Wemos D1 Mini) instead means
; re-deriving PACK_FULL_ADC/PACK_FULL_V for that board's scaling — see README.md.
[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
