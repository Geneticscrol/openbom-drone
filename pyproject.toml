[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openbom-drone"
version = "0.1.0"
description = "5-inch FPV bill of materials: example INR, grams, shop links"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
openbom = "openbom.web:serve"

[tool.setuptools.packages.find]
include = ["openbom*"]

[tool.setuptools.package-data]
openbom = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
