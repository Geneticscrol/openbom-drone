<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenBOM-Drone</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <p class="eyebrow">Your 5-inch · rupees · grams</p>
    <h1>OpenBOM-Drone</h1>
    <p class="lede">Tick parts. See cost and weight. Prices are <strong>examples</strong> — open the shop link before you pay.</p>
  </header>
  <section class="totals" id="totals">
    <div><span id="inr">₹0</span><label>example INR</label></div>
    <div><span id="grams">0 g</span><label>airframe + pack</label></div>
    <div><span id="status">—</span><label>vs <input type="number" id="target" value="650" min="200" max="2000" /> g target</label></div>
  </section>
  <p id="missing" class="missing"></p>
  <div id="list"></div>
  <p class="export"><button type="button" id="csv">Download CSV</button></p>
  <footer>Localhost only. Edit <code>data/catalog.json</code> for your city prices. MIT.</footer>
  <script src="/app.js"></script>
</body>
</html>
